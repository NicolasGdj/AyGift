<dialog v-if="showBulkImport" v-modal class="modal bulk-modal" aria-labelledby="bulk-title" closedby="any" @cancel.prevent="closeBulkImport">
  <form class="modal-form" @submit.prevent="submitBulkJson">
    <h2 id="bulk-title">Importer des articles en JSON</h2>
    <div class="input-group">
      <label for="bulk-json">JSON</label>
      <textarea id="bulk-json" v-model="bulkJson" required autofocus></textarea>
    </div>
    <div class="modal-buttons">
      <button type="button" class="btn back-btn" @click="fillBulkExample">Voir un exemple</button>
      <button type="submit" class="btn btn-primary">Importer</button>
      <button type="button" class="btn back-btn" @click="closeBulkImport">Fermer</button>
    </div>
    <div v-if="bulkImportResult" class="bulk-results" aria-live="polite">
      <p>{{ bulkImportResult.created.length }} article(s) créé(s)</p>
      <p v-if="bulkImportResult.errors.length" class="error-text">{{ bulkImportResult.errors.length }} erreur(s)</p>
      <ul v-if="bulkImportResult.errors.length">
        <li v-for="err in bulkImportResult.errors" :key="err.index">Entrée {{ err.index + 1 }} ({{ err.name || 'sans nom' }}) — {{ err.error }}</li>
      </ul>
    </div>
  </form>
</dialog>
